# MERGE FRAGMENT ONLY, not a replacement spec for the existing app.
# No live app identifier, deployment trigger or secrets are supplied here.
# Add this internal-only component to the EXISTING DigitalOcean STAGING app.
services:
  - name: a350-capacity
    github:
      repo: hartshornemark/WAB
      branch: fix/a350-solver-cargo-capacity
      deploy_on_push: false
    source_dir: /
    dockerfile_path: solver/staging/Dockerfile
    internal_ports: [8080]
    instance_count: 1
    health_check:
      http_path: /healthz
      port: 8080
      initial_delay_seconds: 10
      period_seconds: 30
      timeout_seconds: 10
      failure_threshold: 3
    envs:
      - key: WAB_DEPLOYMENT_ENV
        scope: RUN_TIME
        value: staging
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      - key: CAPACITY_DATABASE_NAME
        scope: RUN_TIME
        value: capacity_staging_reference
      - key: CAPACITY_SERVICE_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONTROL_PANEL
      - key: CAPACITY_DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_RESTRICTED_NATIVE_POSTGRES_URL
      - key: CAPACITY_RELEASE_ID
        scope: RUN_TIME
        value: ${_self.COMMIT_HASH}
# Deliberately no public ingress/http_port and no database creation declaration.
# Select the CPU/RAM instance size to match the intended host before approval;
# record it with the measurements rather than invent a resource allocation.
