<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A319 Hold and Door Overlay</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#fff;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
    .stage{position:relative;width:100vw;height:355px;margin-top:125px;overflow:hidden}
    .aircraft{position:absolute;width:100%;height:auto;left:0;top:-130px;transform:rotate(180deg);display:block}
    .overlay{position:absolute;inset:0;width:100%;height:100%}
    .hold-label{font-size:22px;font-weight:700;fill:#17335f;text-anchor:middle}
    .hold-range{font-size:15px;fill:#17335f;text-anchor:middle}
    .door-label{font-size:14px;font-weight:700;fill:#a7283b;text-anchor:middle}
  </style>
</head>
<body>
  <div class="stage">
    <img class="aircraft" src="a319-plan-vector-cropped-source.svg" alt="A319 plan view, tail left and nose right">
    <svg class="overlay" viewBox="0 0 1200 355" preserveAspectRatio="none" aria-label="Aircraft hold and door locations">
      <g>
        <rect x="852" y="151" width="108" height="70" rx="8" fill="#2f6cc5" fill-opacity=".25" stroke="#2f6cc5" stroke-width="3"/>
        <text x="906" y="181" class="hold-label">HOLD 1</text>
        <text x="906" y="207" class="hold-range">9.858–13.107 m</text>

        <rect x="488" y="151" width="147" height="70" rx="8" fill="#2f855a" fill-opacity=".25" stroke="#2f855a" stroke-width="3"/>
        <text x="561.5" y="181" class="hold-label">HOLD 4</text>
        <text x="561.5" y="207" class="hold-range">19.608–24.028 m</text>

        <rect x="380" y="151" width="108" height="70" rx="8" fill="#d89b28" fill-opacity=".25" stroke="#d89b28" stroke-width="3"/>
        <text x="434" y="181" class="hold-label">HOLD 5</text>
        <text x="434" y="207" class="hold-range">24.028–27.270 m</text>
      </g>

      <g fill="none" stroke="#c53b4c" stroke-width="8">
        <path d="M879 241 H933 M879 231 V251 M933 231 V251"/>
        <path d="M531 241 H592 M531 231 V251 M592 231 V251"/>
        <path d="M418 241 H450 M418 231 V251 M450 231 V251"/>
      </g>
      <g>
        <text x="906" y="275" class="door-label">DOOR 1</text>
        <text x="561.5" y="275" class="door-label">DOOR 4</text>
        <text x="434" y="275" class="door-label">DOOR 5</text>
      </g>
    </svg>
  </div>
</body>
</html>
